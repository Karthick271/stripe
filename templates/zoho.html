<!doctype html>
<title>Zoho CRM OAuth</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding: 24px; }
  .card { max-width: 560px; margin: 0 auto; padding: 24px; border: 1px solid #e5e7eb; border-radius: 14px; }
  button, .btn { display: inline-block; padding: 10px 16px; border-radius: 10px; border: 0; cursor: pointer; }
  .primary { background: black; color: white; }
  .danger { background: #ef4444; color: white; }
  .muted { color: #6b7280; }
  code { background: #f3f4f6; padding: 2px 6px; border-radius: 6px; }
</style>
<div class="card">
  <h2>Zoho CRM Connection</h2>
  {% if connected %}
    <p>✅ Connected. Access token auto-refreshes using stored refresh token.</p>
    <form method="post" action="/disconnect" onsubmit="return confirm('Disconnect Zoho?');">
      <button class="danger">Disconnect</button>
    </form>
  {% else %}
    <p class="muted">Not connected.</p>
    <a class="btn primary" href="/auth">Connect Zoho</a>
  {% endif %}
  <hr/>
  <p class="muted">
    Accounts DC: <code>{{ accounts_url }}</code> &middot; Scope: <code>{{ scope }}</code><br/>
    Redirect URI: <code>{{ redirect_uri }}</code>
  </p>
</div>
